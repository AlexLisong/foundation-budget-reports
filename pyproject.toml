[project]
name = "foundation-budget-reports"
version = "0.1.0"
description = "Traceable foundation takeoffs and bilingual preliminary budget PDFs"
requires-python = ">=3.10"
dependencies = ["reportlab>=4.4,<6", "PyMuPDF>=1.26,<2"]

[project.scripts]
foundation-budget = "foundation_budget.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foundation_budget"]
